version: "3.8"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  OTP_LESS_CLIENT_ID: ${OTP_LESS_CLIENT_ID}
  OTP_LESS_CLIENT_SECRET: ${OTP_LESS_CLIENT_SECRET}

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: matchpit/api-server:latest
    restart: always
    read_only: true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: matchpit/api-server:latest
    restart: always
    command: ["node", "dist/worker.mjs"]
    read_only: true
    cap_drop:
      - ALL
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      WORKER_PORT: 8081
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    # REMOVED public port exposure for security
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
