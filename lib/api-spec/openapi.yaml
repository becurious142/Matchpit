openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MATCHPIT API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user profiles
  - name: venues
    description: Sports venue operations
  - name: slots
    description: Venue slot operations
  - name: bookings
    description: Private turf bookings
  - name: hosted-matches
    description: Hosted social matches
  - name: payments
    description: Payment processing
  - name: wallet
    description: Wallet and rewards
  - name: dashboard
    description: Dashboard summaries
  - name: admin
    description: Admin operations
  - name: notifications
    description: Notification operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─────────── PROFILE ───────────
  /profile/me:
    get:
      operationId: getMyProfile
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMyProfile
      tags: [auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  # ─────────── VENUES ───────────
  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List all venues
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: sport
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: List of venues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"

  /venues/featured:
    get:
      operationId: listFeaturedVenues
      tags: [venues]
      summary: Get featured venues
      responses:
        "200":
          description: Featured venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Venue"

  /venues/sports:
    get:
      operationId: listSports
      tags: [venues]
      summary: List available sports categories
      responses:
        "200":
          description: Sports categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportCategory"

  /venues/{venueId}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get venue detail
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /venues/{venueId}/slots:
    get:
      operationId: getVenueSlots
      tags: [slots]
      summary: Get available slots for a venue (14-day calendar)
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Slots grouped by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlotDay"

  # ─────────── BOOKINGS ───────────
  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: Get my bookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, past, cancelled]
      responses:
        "200":
          description: My bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a private turf booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Slot unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking detail
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ─────────── HOSTED MATCHES ───────────
  /hosted-matches:
    get:
      operationId: listHostedMatches
      tags: [hosted-matches]
      summary: Browse hosted social matches
      parameters:
        - name: sport
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: skillLevel
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced, any]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, confirmed, funded, cancelled, expired]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: List of hosted matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedMatchListResponse"
    post:
      operationId: createHostedMatch
      tags: [hosted-matches]
      summary: Create a hosted match (host pays commitment fee)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHostedMatchBody"
      responses:
        "201":
          description: Hosted match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedMatch"

  /hosted-matches/my:
    get:
      operationId: listMyHostedMatches
      tags: [hosted-matches]
      summary: Get matches I hosted
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My hosted matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostedMatch"

  /hosted-matches/joined:
    get:
      operationId: listJoinedMatches
      tags: [hosted-matches]
      summary: Get matches I joined as participant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Joined matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostedMatchParticipant"

  /hosted-matches/{matchId}:
    get:
      operationId: getHostedMatch
      tags: [hosted-matches]
      summary: Get hosted match detail
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedMatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosted-matches/{matchId}/join:
    post:
      operationId: joinHostedMatch
      tags: [hosted-matches]
      summary: Reserve spot in hosted match
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Spot reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedMatchParticipant"
        "409":
          description: Match full or already joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosted-matches/{matchId}/participants:
    get:
      operationId: getMatchParticipants
      tags: [hosted-matches]
      summary: Get participants in a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostedMatchParticipant"

  /hosted-matches/{matchId}/final-payment:
    post:
      operationId: payMatchFinalAmount
      tags: [hosted-matches]
      summary: Pay final amount for confirmed match
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"

  # ─────────── PAYMENTS ───────────
  /payments/create-order:
    post:
      operationId: createPaymentOrder
      tags: [payments]
      summary: Create a Razorpay payment order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderBody"
      responses:
        "201":
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"

  /payments/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify and capture Razorpay payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentBody"
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerifyResponse"
        "400":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/history:
    get:
      operationId: listPaymentHistory
      tags: [payments]
      summary: Get my payment history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  # ─────────── WALLET ───────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet balance and recent transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  # ─────────── DASHBOARD ───────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get user dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─────────── NOTIFICATIONS ───────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get my notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ─────────── OWNER LEADS ───────────
  /owner-leads:
    post:
      operationId: submitOwnerLead
      tags: [venues]
      summary: Submit venue owner lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerLeadBody"
      responses:
        "201":
          description: Lead submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerLead"

  # ─────────── ADMIN ───────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin platform statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: List all bookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /admin/hosted-matches:
    get:
      operationId: listAdminHostedMatches
      tags: [admin]
      summary: List all hosted matches
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Hosted matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostedMatch"

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: Payment ledger
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /admin/venues:
    get:
      operationId: listAdminVenues
      tags: [admin]
      summary: List venues for approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueDetail"

  /admin/venues/{venueId}/approve:
    patch:
      operationId: approveVenue
      tags: [admin]
      summary: Approve or reject a venue
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: venueId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isApproved:
                  type: boolean
              required: [isApproved]
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetail"

  /admin/venues/{venueId}/featured:
    patch:
      operationId: setVenueFeatured
      tags: [admin]
      summary: Toggle venue featured flag
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: venueId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isFeatured:
                  type: boolean
              required: [isFeatured]
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueDetail"

  /admin/owner-leads:
    get:
      operationId: listAdminOwnerLeads
      tags: [admin]
      summary: List owner leads
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerLead"

  /admin/owner-leads/{leadId}/status:
    patch:
      operationId: updateOwnerLeadStatus
      tags: [admin]
      summary: Update owner lead status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [new, contacted, onboarded, rejected]
              required: [status]
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerLead"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    # ─── PROFILE ───
    Profile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        favoriteSports:
          type: array
          items:
            type: string
        avatarUrl:
          type: string
          nullable: true
        walletBalance:
          type: number
        badgeCount:
          type: integer
        trustScore:
          type: number
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, clerkId, fullName, email, walletBalance, badgeCount, trustScore, isAdmin, createdAt, favoriteSports]

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        city:
          type: string
        favoriteSports:
          type: array
          items:
            type: string
        avatarUrl:
          type: string

    # ─── VENUE ───
    Venue:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        address:
          type: string
        sports:
          type: array
          items:
            type: string
        pricePerHour:
          type: number
        coverImage:
          type: string
          nullable: true
        rating:
          type: number
        totalReviews:
          type: integer
        isApproved:
          type: boolean
        amenities:
          type: array
          items:
            type: string
      required: [id, name, city, address, sports, pricePerHour, rating, totalReviews, isApproved, amenities]

    VenueDetail:
      allOf:
        - $ref: "#/components/schemas/Venue"
        - type: object
          properties:
            images:
              type: array
              items:
                type: string
            description:
              type: string
              nullable: true
            openTime:
              type: string
            closeTime:
              type: string
            contactPhone:
              type: string
              nullable: true
            ownerName:
              type: string
              nullable: true
            upcomingMatches:
              type: integer
          required: [images, openTime, closeTime, upcomingMatches]

    VenueListResponse:
      type: object
      properties:
        venues:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [venues, total, page, totalPages]

    SportCategory:
      type: object
      properties:
        slug:
          type: string
        label:
          type: string
        icon:
          type: string
        venueCount:
          type: integer
      required: [slug, label, icon, venueCount]

    # ─── SLOTS ───
    Slot:
      type: object
      properties:
        id:
          type: string
        venueId:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        priceOverride:
          type: number
          nullable: true
        status:
          type: string
          enum: [available, held, booked, unavailable]
        sport:
          type: string
          nullable: true
      required: [id, venueId, date, startTime, endTime, status]

    SlotDay:
      type: object
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
      required: [date, slots]

    # ─── BOOKINGS ───
    Booking:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        venueId:
          type: string
        slotId:
          type: string
        sport:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        totalAmount:
          type: number
        status:
          type: string
          enum: [pending_payment, confirmed, cancelled, completed]
        paymentId:
          type: string
          nullable: true
        venue:
          $ref: "#/components/schemas/Venue"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, venueId, slotId, sport, date, startTime, endTime, totalAmount, status, createdAt]

    CreateBookingBody:
      type: object
      properties:
        venueId:
          type: string
        slotId:
          type: string
        sport:
          type: string
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string
      required: [venueId, slotId, sport, razorpayOrderId, razorpayPaymentId, razorpaySignature]

    # ─── HOSTED MATCHES ───
    HostedMatch:
      type: object
      properties:
        id:
          type: string
        hostUserId:
          type: string
        venueId:
          type: string
        slotId:
          type: string
        sport:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        totalPlayers:
          type: integer
        minPlayers:
          type: integer
        currentPlayers:
          type: integer
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, any]
        hostFee:
          type: number
        reserveFee:
          type: number
        finalFeePerPlayer:
          type: number
        totalVenueCost:
          type: number
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, confirmed, funded, cancelled, expired]
        financialStatus:
          type: string
          enum: [pending, partially_funded, funded]
        venue:
          $ref: "#/components/schemas/Venue"
          nullable: true
        host:
          $ref: "#/components/schemas/Profile"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, hostUserId, venueId, slotId, sport, date, startTime, endTime, totalPlayers, minPlayers, currentPlayers, skillLevel, hostFee, reserveFee, finalFeePerPlayer, totalVenueCost, status, financialStatus, createdAt]

    HostedMatchDetail:
      allOf:
        - $ref: "#/components/schemas/HostedMatch"
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/HostedMatchParticipant"
            spotsLeft:
              type: integer
            isUserJoined:
              type: boolean
          required: [participants, spotsLeft, isUserJoined]

    HostedMatchListResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/HostedMatch"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [matches, total, page, totalPages]

    CreateHostedMatchBody:
      type: object
      properties:
        venueId:
          type: string
        slotId:
          type: string
        sport:
          type: string
        totalPlayers:
          type: integer
        minPlayers:
          type: integer
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, any]
        notes:
          type: string
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string
      required: [venueId, slotId, sport, totalPlayers, minPlayers, skillLevel, razorpayOrderId, razorpayPaymentId, razorpaySignature]

    HostedMatchParticipant:
      type: object
      properties:
        id:
          type: string
        matchId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [reserved, final_paid, cancelled]
        reservePaymentId:
          type: string
          nullable: true
        finalPaymentId:
          type: string
          nullable: true
        user:
          $ref: "#/components/schemas/Profile"
          nullable: true
        match:
          $ref: "#/components/schemas/HostedMatch"
          nullable: true
        joinedAt:
          type: string
          format: date-time
      required: [id, matchId, userId, status, joinedAt]

    # ─── PAYMENTS ───
    CreatePaymentOrderBody:
      type: object
      properties:
        type:
          type: string
          enum: [booking, host_commitment, match_reserve, match_final]
        referenceId:
          type: string
        amount:
          type: number
      required: [type, referenceId, amount]

    PaymentOrder:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: number
        currency:
          type: string
        razorpayKeyId:
          type: string
        prefillName:
          type: string
          nullable: true
        prefillEmail:
          type: string
          nullable: true
        prefillContact:
          type: string
          nullable: true
      required: [orderId, amount, currency, razorpayKeyId]

    VerifyPaymentBody:
      type: object
      properties:
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        razorpaySignature:
          type: string
        type:
          type: string
          enum: [booking, host_commitment, match_reserve, match_final]
        referenceId:
          type: string
      required: [razorpayOrderId, razorpayPaymentId, razorpaySignature, type, referenceId]

    PaymentVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
        paymentId:
          type: string
        referenceId:
          type: string
        type:
          type: string
      required: [success, paymentId, referenceId, type]

    Payment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [booking, host_commitment, match_reserve, match_final, refund, cashback]
        referenceId:
          type: string
          nullable: true
        razorpayOrderId:
          type: string
          nullable: true
        razorpayPaymentId:
          type: string
          nullable: true
        amount:
          type: number
        status:
          type: string
          enum: [pending, success, failed, refunded]
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, amount, status, createdAt]

    # ─── WALLET ───
    WalletLedgerEntry:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [credit, debit]
        reason:
          type: string
        amount:
          type: number
        balanceAfter:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, type, reason, amount, balanceAfter, createdAt]

    Wallet:
      type: object
      properties:
        balance:
          type: number
        totalEarned:
          type: number
        totalSpent:
          type: number
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/WalletLedgerEntry"
      required: [balance, totalEarned, totalSpent, ledger]

    # ─── DASHBOARD ───
    DashboardSummary:
      type: object
      properties:
        upcomingBookingsCount:
          type: integer
        totalMatchesJoined:
          type: integer
        totalMatchesHosted:
          type: integer
        walletBalance:
          type: number
        pendingFinalPaymentsCount:
          type: integer
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        confirmedMatches:
          type: array
          items:
            $ref: "#/components/schemas/HostedMatch"
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
      required: [upcomingBookingsCount, totalMatchesJoined, totalMatchesHosted, walletBalance, pendingFinalPaymentsCount, upcomingBookings, confirmedMatches, badges]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [booking_confirmed, match_joined, match_hosted, match_confirmed, payment_success, badge_earned]
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        referenceId:
          type: string
          nullable: true
      required: [id, type, title, description, createdAt]

    Badge:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        earnedAt:
          type: string
          format: date-time
      required: [id, slug, label, description, icon, earnedAt]

    # ─── NOTIFICATIONS ───
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [payment_success, match_joined, match_confirmed, final_payment_pending, booking_reminder, match_cancelled, badge_earned]
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        referenceId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, title, body, isRead, createdAt]

    # ─── OWNER LEADS ───
    OwnerLeadBody:
      type: object
      properties:
        venueName:
          type: string
        ownerName:
          type: string
        phone:
          type: string
        city:
          type: string
        sports:
          type: array
          items:
            type: string
        message:
          type: string
          nullable: true
      required: [venueName, ownerName, phone, city, sports]

    OwnerLead:
      type: object
      properties:
        id:
          type: string
        venueName:
          type: string
        ownerName:
          type: string
        phone:
          type: string
        city:
          type: string
        sports:
          type: array
          items:
            type: string
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, contacted, onboarded, rejected]
        createdAt:
          type: string
          format: date-time
      required: [id, venueName, ownerName, phone, city, sports, status, createdAt]

    # ─── ADMIN ───
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalVenues:
          type: integer
        totalBookings:
          type: integer
        totalHostedMatches:
          type: integer
        totalRevenue:
          type: number
        activeMatches:
          type: integer
        pendingVenueApprovals:
          type: integer
        newOwnerLeads:
          type: integer
      required: [totalUsers, totalVenues, totalBookings, totalHostedMatches, totalRevenue, activeMatches, pendingVenueApprovals, newOwnerLeads]

    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        total:
          type: integer
        page:
          type: integer
      required: [users, total, page]
