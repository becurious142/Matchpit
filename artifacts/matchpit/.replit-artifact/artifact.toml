kind = "web"
previewPath = "/"
title = "MATCHPIT"
version = "1.0.0"
id = "artifacts/matchpit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24208

[services.development]
run = "pnpm --filter @workspace/matchpit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matchpit", "run", "build" ]
publicDir = "artifacts/matchpit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24208"
BASE_PATH = "/"
