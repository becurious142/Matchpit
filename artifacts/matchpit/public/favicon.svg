<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="36" fill="#22c55e"/>

  <!-- Stadium/pitch outline -->
  <ellipse cx="90" cy="90" rx="70" ry="55" stroke="white" stroke-width="4" fill="none"/>
  <line x1="90" y1="35" x2="90" y2="145" stroke="white" stroke-width="3"/>
  <circle cx="90" cy="90" r="18" stroke="white" stroke-width="3" fill="none"/>

  <!-- Center kickoff dot -->
  <circle cx="90" cy="90" r="5" fill="white"/>

  <!-- Goal areas -->
  <rect x="35" y="70" width="12" height="40" stroke="white" stroke-width="2" fill="none"/>
  <rect x="133" y="70" width="12" height="40" stroke="white" stroke-width="2" fill="none"/>

  <!-- Corner arcs -->
  <path d="M 25 50 Q 40 35 55 35" stroke="white" stroke-width="2" fill="none"/>
  <path d="M 125 35 Q 140 35 155 50" stroke="white" stroke-width="2" fill="none"/>
  <path d="M 25 130 Q 40 145 55 145" stroke="white" stroke-width="2" fill="none"/>
  <path d="M 125 145 Q 140 145 155 130" stroke="white" stroke-width="2" fill="none"/>
</svg>
